<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>PromptVault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>PromptVault</h1>
        <p><span data-prompt-count>—</span> bundled prompts</p>
      </div>
      <a class="external-link" href="https://jiejuefuyou.github.io/prompts.html" target="_blank" rel="noopener noreferrer">Web edition ↗</a>
    </header>

    <section class="search-wrap" aria-label="Search prompt library">
      <label class="visually-hidden" for="search">Search prompts</label>
      <input id="search" class="search" type="search" placeholder="Search title, body, or tags…" autocomplete="off" spellcheck="false">
      <div id="resultStatus" class="result-status" role="status" aria-live="polite"></div>
    </section>

    <div id="loading" class="loading">Loading bundled prompt library…</div>
    <button id="retry" class="btn btn-secondary retry" type="button" hidden>Retry</button>
    <section id="list" class="list" aria-label="Prompt results" hidden></section>

    <footer class="footer">
      Local-only library · <a href="https://github.com/jiejuefuyou/promptvault-chrome" target="_blank" rel="noopener noreferrer">source</a>
    </footer>
  </main>

  <dialog id="promptDialog" class="dialog" aria-labelledby="dialogTitle">
    <div class="dialog-shell">
      <header class="dialog-head">
        <h2 id="dialogTitle" class="dialog-title"></h2>
        <button id="dialogClose" class="icon-button" type="button" aria-label="Close prompt">×</button>
      </header>
      <div id="dialogBody" class="dialog-body"></div>
      <div id="dialogStatus" class="dialog-status" role="status" aria-live="polite"></div>
      <footer class="dialog-foot">
        <button id="dialogBack" class="btn btn-secondary" type="button">Back</button>
        <button id="dialogCopy" class="btn btn-primary" type="button">Copy to clipboard</button>
      </footer>
    </div>
  </dialog>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
