name: One-shot canonical prompt corpus sync

on:
  push:
    branches: [agent/extension-core-v1]
    paths:
      - ".github/workflows/sync-prompt-corpus-once.yml"
  pull_request:
    branches: [agent/extension-core-v1]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/corpus-sync-trigger"

permissions:
  contents: write

concurrency:
  group: promptvault-chrome-corpus-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Generate, verify, commit, and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extension-core-v1
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: jiejuefuyou/promptvault-wechat-miniprogram
          ref: 2f0ed5f319b2475fc3375f11cd0f43cb998bb39d
          path: .canonical-wechat
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Project canonical title/body/tags into packaged Chrome bundle
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          function bounds(source, marker) {
            const markerIndex = source.indexOf(marker);
            if (markerIndex < 0) throw new Error(`marker not found: ${marker}`);
            const start = source.indexOf('[', markerIndex + marker.length);
            if (start < 0) throw new Error(`array not found after: ${marker}`);
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let index = start; index < source.length; index += 1) {
              const character = source[index];
              if (inString) {
                if (escaped) escaped = false;
                else if (character === '\\') escaped = true;
                else if (character === '"') inString = false;
                continue;
              }
              if (character === '"') inString = true;
              else if (character === '[') depth += 1;
              else if (character === ']') {
                depth -= 1;
                if (depth === 0) return [start, index + 1];
              }
            }
            throw new Error(`unterminated array after: ${marker}`);
          }

          function parseArray(source, marker) {
            const [start, end] = bounds(source, marker);
            return JSON.parse(source.slice(start, end));
          }

          function normalizeText(value) {
            const lines = String(value ?? '')
              .normalize('NFKC')
              .replace(/\r\n/g, '\n')
              .replace(/\r/g, '\n')
              .split('\n')
              .map((line) => line.trimEnd());
            while (lines.length && lines[0] === '') lines.shift();
            while (lines.length && lines[lines.length - 1] === '') lines.pop();
            return lines.join('\n');
          }

          function normalizeTag(value) {
            return normalizeText(value).split(/\s+/u).filter(Boolean).join(' ');
          }

          const canonicalPath = '.canonical-wechat/utils/prompts.js';
          const targetPath = 'src/popup.js';
          const canonical = parseArray(fs.readFileSync(canonicalPath, 'utf8'), 'module.exports =');
          if (canonical.length !== 160) throw new Error(`expected 160 canonical prompts, found ${canonical.length}`);
          const projected = canonical.map((raw, index) => {
            const title = normalizeText(raw.title);
            const body = normalizeText(raw.body);
            const tags = Array.isArray(raw.tags)
              ? [...new Set(raw.tags.map(normalizeTag).filter(Boolean))]
              : [];
            if (!title || !body) throw new Error(`canonical prompt ${index + 1} lacks title/body`);
            return { title, body, tags };
          });
          if (new Set(projected.map((item) => `${item.title}\u0000${item.body}`)).size !== projected.length) {
            throw new Error('canonical corpus contains exact duplicate title/body records');
          }

          const target = fs.readFileSync(targetPath, 'utf8');
          const [start, end] = bounds(target, 'const PROMPTS =');
          const prefix = target.slice(0, start);
          const suffix = target.slice(end);
          const output = prefix + JSON.stringify(projected, null, 2) + suffix;
          fs.writeFileSync(targetPath, output, 'utf8');
          const digest = crypto.createHash('sha256').update(output).digest('hex');
          const expected = '25b1e25fc75c99787e729eec81c72db5e89f751132cc64859c64a4bdbec58304';
          if (digest !== expected) throw new Error(`generated SHA mismatch: ${digest} != ${expected}`);
          if (!output.startsWith(prefix) || !output.endsWith(suffix)) throw new Error('bundle wrapper changed');
          console.log(`generated ${projected.length} prompts, sha256=${digest}`);
          NODE
      - name: Verify the generated extension against its real bundle
        run: npm run verify
      - name: Commit the tested generated bundle and remove this one-shot workflow
        run: |
          rm -rf .canonical-wechat
          rm .github/workflows/sync-prompt-corpus-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/popup.js .github/workflows/sync-prompt-corpus-once.yml
          git commit -m "data: sync 160 prompts from canonical corpus"
          git push origin HEAD:agent/extension-core-v1
          {
            echo "## Canonical corpus sync"
            echo
            echo "- canonical: promptvault-wechat-miniprogram@2f0ed5f319b2475fc3375f11cd0f43cb998bb39d"
            echo "- generated: 160 prompts"
            echo "- file sha256: 25b1e25fc75c99787e729eec81c72db5e89f751132cc64859c64a4bdbec58304"
            echo "- tested commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
